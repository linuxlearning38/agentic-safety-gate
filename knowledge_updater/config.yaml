# ============================================================
# AVA Knowledge Updater - Phase 3 Configuration
# ============================================================

# --- ChromaDB ---
chromadb:
  host: "localhost"
  port: 8000
  persist_directory: "/mnt/i/ai-lab/chromadb"
  policies_collection: "devops_policies_v2"
  blogs_collection: "devops_blogs_v1"

# --- Embedding Model ---
embedding:
  model: "nomic-embed-text"
  ollama_url: "http://localhost:11434"

# --- Blog Sources ---
# Kill switch: set enabled: false to disable without redeploying
# Test new sources with: python3 -m knowledge_updater.scheduler --source "Name" --dry-run
sources:
  - name: "AWS DevOps"
    url: "https://aws.amazon.com/blogs/devops/"
    rss: "https://aws.amazon.com/blogs/devops/feed/"
    max_articles: 10
    min_content_length: 500
    enabled: true

  - name: "Cloudflare Blog"
    url: "https://blog.cloudflare.com"
    rss: "https://blog.cloudflare.com/rss/"
    max_articles: 8
    min_content_length: 500
    enabled: true

  - name: "Kubernetes Blog"
    url: "https://kubernetes.io/blog/"
    rss: "https://kubernetes.io/feed.xml"
    max_articles: 8
    min_content_length: 400
    enabled: true

  # ❌ Phase 2 broken — HTTP 429, bot blocked, empty RSS summaries
  # Replaced by Datadog Engineering in Phase 3 (tomorrow's session)
  - name: "HashiCorp Blog"
    url: "https://www.hashicorp.com/blog"
    rss: "https://www.hashicorp.com/blog/feed.xml"
    max_articles: 8
    min_content_length: 500
    enabled: false
    request_delay: 6

  # ❌ Phase 2 broken — malformed RSS, invalid XML token at position 3:250
  # Replaced by Pulumi Blog in Phase 3 (tomorrow's session)
  - name: "Spacelift Blog"
    url: "https://spacelift.io/blog"
    rss: "https://spacelift.io/blog/rss.xml"
    max_articles: 8
    min_content_length: 500
    enabled: false

  # ─── Phase 3 replacements (enable tomorrow after --dry-run test) ──────────
  - name: "Pulumi Blog"
    url: "https://www.pulumi.com/blog/"
    rss: "https://www.pulumi.com/blog/rss.xml"
    max_articles: 8
    min_content_length: 400
    enabled: false   # flip to true after dry-run confirms working

  - name: "Datadog Engineering"
    url: "https://www.datadoghq.com/blog/engineering/"
    rss: "https://www.datadoghq.com/blog/engineering/feed/"
    max_articles: 8
    min_content_length: 400
    enabled: false   # flip to true after dry-run confirms working

  # ─── Phase 3 new sources (enable tomorrow after --dry-run test) ──────────
  - name: "Azure DevOps Blog"
    url: "https://devblogs.microsoft.com/devops/"
    rss: "https://devblogs.microsoft.com/devops/feed/"
    max_articles: 8
    min_content_length: 400
    enabled: false

  - name: "Jenkins Blog"
    url: "https://www.jenkins.io/blog/"
    rss: "https://www.jenkins.io/blog/rss.xml"
    max_articles: 8
    min_content_length: 400
    enabled: false

  - name: "Red Hat Blog"
    url: "https://www.redhat.com/en/blog"
    rss: "https://www.redhat.com/en/rss/blog"
    max_articles: 8
    min_content_length: 400
    enabled: false

  - name: "Ubuntu Blog"
    url: "https://ubuntu.com/blog"
    rss: "https://ubuntu.com/blog/feed"
    max_articles: 6
    min_content_length: 400
    enabled: false

  - name: "Ansible Blog"
    url: "https://www.ansible.com/blog"
    rss: "https://www.ansible.com/blog/rss.xml"
    max_articles: 8
    min_content_length: 400
    enabled: false

  - name: "GCP Blog"
    url: "https://cloud.google.com/blog/products/devops-sre"
    rss: "https://cloud.google.com/feeds/gcp-blog-it.xml"
    max_articles: 8
    min_content_length: 400
    enabled: false

# --- Chunking ---
chunking:
  chunk_size: 400
  chunk_overlap: 50
  min_chunk_size: 150

# --- Quality Scoring ---
quality:
  min_score: 0.4
  signals:
    has_code_blocks: 0.25
    has_headers: 0.10
    word_count_min: 300
    word_count_ideal: 1200
    technical_keywords: 0.20
    no_paywall_signals: 0.15

# --- Deduplication ---
dedup:
  check_url: true
  check_content_hash: true
  hash_algorithm: "sha256"

# --- Ingestion Limits (Phase 3) ---
# Hard cap per run — prevents DB bloat as we add more sources
limits:
  max_new_chunks_per_run: 200
  # Weak source warning threshold — print warning if source yields fewer than this
  weak_source_threshold: 5

# --- Scraper Behaviour ---
scraper:
  request_timeout: 15
  delay_between_requests: 2
  max_retries: 2
  user_agent: "AVA-KnowledgeBot/2.0 (local research assistant; non-commercial)"

# --- Scheduler ---
scheduler:
  enabled: true
  cron: "0 2 * * 0"
  log_file: "/mnt/i/ai-lab/logs/knowledge_updater.log"
  run_report: "/mnt/i/ai-lab/reports/knowledge_update_report.json"

# --- Dry Run ---
dry_run: false
