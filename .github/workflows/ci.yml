name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python files
        run: |
          find . -name "*.py" \
            ! -path "./venv/*" \
            ! -path "./.git/*" \
            ! -path "./__pycache__/*" \
            -exec python -m py_compile {} +

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    env:
      CHROMA_PATH: /tmp/chromadb_test
      HISTORY_FILE: /tmp/query_history.json
      MEMORY_PATH: /tmp/ava_memory.json
      FLASK_ENV: testing
      OLLAMA_HOST: http://localhost:11434
      AVA_ROOT_READ_ONLY: "true"
      AVA_MONITOR_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intelligence regression
        run: python tests/intelligence_regression.py

      - name: Run capability router regression
        run: python tests/capability_router_regression.py

      - name: Run benchmark suite
        run: python tests/ava_benchmark_suite.py

      - name: Run security hardening regression
        run: python tests/security_hardening_regression.py
