
services:

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agent_postgres
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: localdev_only
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    container_name: agent_opa
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies
    command: >
      run --server --addr=0.0.0.0:8181 /policies
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: agent_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "localdev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ava_docker_socket_proxy
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ava:
    build:
      context: .
      dockerfile: Dockerfile
    image: ava-agent:latest
    container_name: ava-agent
    user: "999:999"
    ports:
      - "5443:5443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

    volumes:
      - ./certs:/app/certs:ro
      - /home/manoj/ava-data:/data
      - /proc:/host/proc:ro

    env_file:
      - .env

    environment:
      CHROMA_PATH:         /data/chromadb
      HISTORY_FILE:        /data/query_history.json
      MEMORY_PATH:         /data/ava_memory.json
      GUNICORN_ACCESS_LOG: /tmp/ava_access.log
      GUNICORN_ERROR_LOG:  /tmp/ava_error.log
      OLLAMA_HOST:         http://host.docker.internal:11434
      AVA_HOST_PROC:       /host/proc
      FLASK_ENV:           production
      LLM_WARMUP_ENABLED:  "false"
      AVA_MONITOR_ENABLED: "false"
      AVA_ROOT_READ_ONLY:  "true"
      WEBHOOK_SECRET:      ${WEBHOOK_SECRET:-}
      DB_PATH:             /data/ava.db
      AVA_DATA_DIR:        /data
      APPROVAL_QUEUE_PATH: /data/approval_queue.json
      EXECUTION_LOG_PATH:  /data/execution_log.json
      SECURITY_AUDIT_PATH: /data/security_audit.json
      SECURITY_AUDIT_LOG:  /data/security_audit.json
      WHITELIST_PATH:      /data/control_whitelist.json
      AVA_REPORTS_DIR:     /data/ava_reports
      HOME:                /tmp
      TRIVY_CACHE_DIR:     /tmp/trivy-cache
      LYNIS_REPORT_PATH:   /tmp/lynis-report.dat
      LYNIS_LOG_PATH:      /tmp/lynis.log
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/pycache
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      DOCKER_HOST:         http://docker-socket-proxy:2375
      AVA_OPA_ACTION_POLICY_ENABLED: "true"
      OPA_ACTION_POLICY_URL: http://opa:8181/v1/data/ava/authz/decision
      AVA_COMMAND_SIGNING_KEY: ${AVA_COMMAND_SIGNING_KEY:-}
      AVA_COMMAND_REPLAY_CACHE_PATH: /data/command_replay_cache.json

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - redis
      - postgres
      - opa
      - docker-socket-proxy

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          urllib.request.urlopen('https://localhost:5443/health', context=ctx, timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

    restart: unless-stopped
