
services:

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agent_postgres
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: localdev_only
    ports:
      - "5432:5432"
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    container_name: agent_opa
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    command: >
      run --server --addr=0.0.0.0:8181 /policies
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: agent_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "localdev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  ava:
    build:
      context: .
      dockerfile: Dockerfile
    image: ava-agent:latest
    container_name: ava-agent
    user: "0:0"
    ports:
      - "5443:5443"

    volumes:
      - ./certs:/app/certs:ro
      - /home/manoj/ava-data/chromadb:/data/chromadb
      - /home/manoj/ava-data/logs:/data/logs
      - /home/manoj/ava-data/query_history.json:/data/history/query_history.json
      - /home/manoj/ava-data/ava_memory.json:/data/ava_memory.json
      - /home/manoj/ava-data/ava.db:/data/ava.db
      - /var/run/docker.sock:/var/run/docker.sock

    env_file:
      - .env

    environment:
      CHROMA_PATH:         /data/chromadb
      HISTORY_FILE:        /data/history/query_history.json
      MEMORY_PATH:         /data/ava_memory.json
      GUNICORN_ACCESS_LOG: /data/logs/ava_access.log
      GUNICORN_ERROR_LOG:  /data/logs/ava_error.log
      OLLAMA_HOST:         http://host.docker.internal:11434
      FLASK_ENV:           production
      WEBHOOK_SECRET:      ${WEBHOOK_SECRET:-ava-webhook-2026}
      DB_PATH:             ${DB_PATH:-/data/ava.db}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - redis
      - postgres

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          urllib.request.urlopen('https://localhost:5443/health', context=ctx, timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

    restart: unless-stopped
